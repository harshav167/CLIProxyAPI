services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      REDIS_QUEUE_ENABLED: "true"
      REDIS_QUEUE_ADDRESS: "valkey:6379"
      REDIS_QUEUE_KEY_PREFIX: "cliproxy:usage"
    ports:
      - "9317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    depends_on:
      valkey:
        condition: service_started
    networks:
      - cliproxy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: cli-proxy-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    networks:
      - cliproxy

volumes:
  valkey-data:

networks:
  cliproxy:
